name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}" --extra dev --extra torch

      - name: Verify matrix interpreter
        run: uv run --python "${{ matrix.python-version }}" python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')))"

      - name: Run fast tests
        run: uv run --python "${{ matrix.python-version }}" pytest tests/ -m "not slow"

  quality:
    name: Static quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: uv sync --python "3.11" --extra dev

      - name: Lint (ruff)
        run: uv run --python "3.11" ruff check pu_toolbox tests benchmarks examples scripts

      - name: Format check (ruff)
        run: uv run --python "3.11" ruff format --check pu_toolbox tests benchmarks examples scripts

      - name: Test quality gate
        run: uv run --python "3.11" python scripts/check_test_quality.py

      - name: Doc consistency check
        run: uv run --python "3.11" python scripts/check_doc_links.py

      - name: Project metadata consistency check
        run: uv run --python "3.11" python scripts/check_project_metadata.py

      - name: Method card MathJax rendering check
        run: uv run --python "3.11" python scripts/check_math_rendering.py

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build source and wheel distributions
        run: uv build

      - name: Install wheel in an isolated environment
        run: |
          uv venv --python "3.11" .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl

      - name: Smoke-test installed wheel outside the checkout
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c "import pu_toolbox; from pu_toolbox.diagnostics import build_diagnostic_report; from pu_toolbox.registry import register_all_builtin_methods, list_algorithms; register_all_builtin_methods(); assert len(list_algorithms()) == 15; assert pu_toolbox.__version__"

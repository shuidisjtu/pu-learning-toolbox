[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pu-toolbox"
version = "1.4.0"
description = "Positive-Unlabeled Learning Python Toolbox — sklearn-compatible"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "shuidisjtu"},
]
keywords = ["pu-learning", "positive-unlabeled", "machine-learning", "scikit-learn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "tomli>=2.0; python_version < '3.11'",
]
torch = [
    "torch>=2.0",
]
research = [
    "densratio==0.3.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "tqdm>=4.0",
]
all = [
    "densratio==0.3.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "lightning>=2.0",
    "tqdm>=4.0",
]

[project.urls]
Repository = "https://github.com/shuidisjtu/pu-learning-toolbox"

[project.scripts]
pu-toolbox = "pu_toolbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pu_toolbox"]
force-include = {".claude/skills/pu-workflow" = ".claude/skills/pu-workflow"}

[tool.hatch.build.targets.sdist]
include = [
    "/pu_toolbox",
    "/tests",
    "/benchmarks",
    "/docs",
    "/examples",
    "/scripts",
    "/.github",
    "/.claude/skills/pu-workflow",
    "/.python-version",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/requirements.txt",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["external/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["D"]  # pydocstyle: enable once docstring conventions are settled

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: slow tests (integration / overfitting behaviour)",
    "contract: shared API contract tests — applied to every NATIVE classifier",
    "unit: fast algorithm-specific unit tests",
    "math: golden tests with hand-computed expected values — failure = code bug",
    "property: mathematical invariant tests — failure = code bug",
    "paper: paper-like reproduction benchmarks (locked datasets / official protocol; runs locally)",
    "integration: cross-component tests (CLI + pipeline + registry + estimators)",
    "e2e: real end-to-end user journeys via real subprocess",
]

[tool.coverage.run]
source = ["pu_toolbox"]
omit = ["tests/*"]
